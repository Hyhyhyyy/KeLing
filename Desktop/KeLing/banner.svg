<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="课灵 KeLing 2.0 · 知识卡片与标签体系">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1206"/>
      <stop offset="0.55" stop-color="#2e2208"/>
      <stop offset="1" stop-color="#15100a"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="haloGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e3"/>
      <stop offset="1" stop-color="#f3e6c4"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="380" fill="url(#bgGrad)"/>

  <!-- (a) BANNER-WIDE MOTION: amber light sweep across the full width -->
  <g>
    <rect x="-220" y="0" width="220" height="380" fill="url(#beamGrad)" opacity="0">
      <animate attributeName="x" values="-220;1500;-220" dur="8.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="8.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g fill="#fde68a">
    <circle cx="0" cy="100" r="2.2" opacity="0.6">
      <animate attributeName="cx" values="-20;1320" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="295" r="1.8" opacity="0.5">
      <animate attributeName="cx" values="1320;-20" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- (b) TITLE-SURROUND MOTION: pulsing halo + draw-on underline -->
  <circle cx="300" cy="128" r="132" fill="url(#haloGrad)">
    <animate attributeName="r" values="116;144;116" dur="4.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.85;0.5" dur="4.4s" repeatCount="indefinite"/>
  </circle>

  <text x="62" y="134" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="48" font-weight="800" fill="url(#titleGrad)">课灵 KeLing 2.0</text>
  <line x1="64" y1="154" x2="300" y2="154" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-dasharray="240" stroke-dashoffset="240">
    <animate attributeName="stroke-dashoffset" values="240;0;0;240" keyTimes="0;0.5;0.85;1" dur="6s" repeatCount="indefinite"/>
  </line>
  <text x="64" y="188" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="500" fill="#fde68a">知识卡片 · 标签体系 · 跨端同步</text>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#fde68a">
    <rect x="64" y="208" width="96" height="30" rx="15" fill="#2e2208"/>
    <text x="84" y="228">知识卡片</text>
    <rect x="176" y="208" width="88" height="30" rx="15" fill="#2e2208"/>
    <text x="196" y="228">标签体系</text>
    <rect x="280" y="208" width="96" height="30" rx="15" fill="#2e2208"/>
    <text x="300" y="228">跨端同步</text>
  </g>

  <!-- HERO MOTIF (right): a stack of knowledge cards with tag chips, synced across ends -->
  <g transform="translate(985,192)">
    <!-- sync lines phone/web -> cards -->
    <g stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="9 7" opacity="0.7">
      <path d="M-150,40 C-110,10 -80,-10 -40,-30">
        <animate attributeName="stroke-dashoffset" values="0;-32;0" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M150,40 C110,10 80,-10 40,-30">
        <animate attributeName="stroke-dashoffset" values="0;-32;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- knowledge card 1 (back) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4.8s" repeatCount="indefinite"/>
      <rect x="-152" y="-58" width="104" height="78" rx="12" fill="url(#cardGrad)"/>
      <rect x="-136" y="-40" width="58" height="8" rx="4" fill="#b08924"/>
      <rect x="-136" y="-24" width="72" height="6" rx="3" fill="#cbb277"/>
      <rect x="-136" y="-10" width="56" height="6" rx="3" fill="#cbb277"/>
      <rect x="-136" y="6" width="40" height="14" rx="7" fill="#f59e0b"/>
    </g>
    <!-- knowledge card 2 (front, center) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="4.4s" begin="0.3s" repeatCount="indefinite"/>
      <rect x="-30" y="-78" width="112" height="84" rx="12" fill="#fffaf0"/>
      <rect x="-12" y="-60" width="64" height="8" rx="4" fill="#b08924"/>
      <rect x="-12" y="-44" width="80" height="6" rx="3" fill="#cbb277"/>
      <rect x="-12" y="-30" width="64" height="6" rx="3" fill="#cbb277"/>
      <rect x="-12" y="-16" width="48" height="6" rx="3" fill="#cbb277"/>
      <rect x="-12" y="2" width="46" height="14" rx="7" fill="#f59e0b"/>
    </g>
    <!-- knowledge card 3 (back right) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5s" begin="0.6s" repeatCount="indefinite"/>
      <rect x="92" y="-56" width="104" height="78" rx="12" fill="url(#cardGrad)"/>
      <rect x="108" y="-38" width="58" height="8" rx="4" fill="#b08924"/>
      <rect x="108" y="-22" width="72" height="6" rx="3" fill="#cbb277"/>
      <rect x="108" y="-8" width="56" height="6" rx="3" fill="#cbb277"/>
      <rect x="108" y="8" width="40" height="14" rx="7" fill="#f59e0b"/>
    </g>
    <!-- floating tag chips -->
    <g font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#fff">
      <g>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
        <rect x="-70" y="-104" width="46" height="20" rx="10" fill="#0ea5e9"/>
        <text x="-58" y="-89">#课程</text>
      </g>
      <g>
        <animate attributeName="opacity" values="1;0.7;1" dur="2.8s" repeatCount="indefinite"/>
        <rect x="20" y="-112" width="46" height="20" rx="10" fill="#10b981"/>
        <text x="32" y="-97">#笔记</text>
      </g>
    </g>
    <!-- two endpoints: phone + web -->
    <g fill="#2e2208" stroke="#fbbf24" stroke-width="2">
      <rect x="-168" y="40" width="34" height="56" rx="6"/>
      <rect x="134" y="40" width="46" height="42" rx="5"/>
    </g>
    <g fill="#fbbf24">
      <rect x="-162" y="48" width="22" height="4" rx="2"/><rect x="-162" y="58" width="22" height="4" rx="2"/>
      <rect x="142" y="48" width="30" height="4" rx="2"/><rect x="142" y="58" width="30" height="4" rx="2"/>
    </g>
  </g>
</svg>
